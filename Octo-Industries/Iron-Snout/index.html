<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="theme-color" content="#ffffff">
    <title>Iron Snout</title>
    <meta name="description" content="Fight waves of wolves as a pig in Iron Snout.">
    <link rel="stylesheet" href="../branding/game-branding.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
    <script defer src="../branding/game-branding.js"></script>
    <script src="../branding/poki-sdk-compat.js"></script>
    <script src="html5game/IronSnout.js"></script>
  </head>
  <body>
    <div class="gm4html5_div_class" id="gm4html5_div_id">
      <canvas id="canvas" width="640" height="360">
        <p>Your browser does not support HTML5 canvas.</p>
      </canvas>
    </div>
    <script>
      var sdk = PokiSDK;
      var pokiDebug = false;
      var canvas = document.getElementById('canvas');

      function poki_log(message) {
        if (pokiDebug) console.log(message);
      }

      function poki_loading() {}

      window.addEventListener('load', function() {
        GameMaker_Init();
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.addEventListener('click', function() {
          window.focus();
        });
      });
    </script>
  </body>
</html>
