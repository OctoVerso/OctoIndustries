<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <title>PvZ2 Gardendless Online | 0.16.1</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
    content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover" />

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes" />
  <meta name="x5-fullscreen" content="true" />
  <meta name="360-fullscreen" content="true" />

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.css" />

  <!-- PVZ-IPAD START: iPad layout, durable saves, offline (see INSTALL-IPAD.md) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PvZ GE">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="ipad.css">
  <script src="ipad.js"></script>
  <script src="save-store.js"></script>
  <!-- PVZ-IPAD END -->

    <link rel="stylesheet" href="../../branding/game-branding.css">
    <script defer src="../../branding/game-branding.js"></script>
  </head>

<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
  </div>


  <!-- Polyfills bundle. -->

  <script src="src/polyfills.bundle.js" charset="utf-8"> </script>


  <!-- SystemJS support. -->
  <script src="src/system.bundle.js" charset="utf-8"> </script>

  <!-- Import map -->
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

  <script src="tmpPatch.js"></script>
  <script>
    // PVZ: wait (max 1.5 s) for saves to be restored from IndexedDB before booting.
    PVZSave.gateBoot(function () { return import(new URL('game-audio.js', document.baseURI).href); })
      .then(function (audio) { return audio.initializeGameAudio(); })
      .then(function () { return System.import('./index.js'); })
      .catch(function (err) { console.error(err); });
  </script>
  <!-- PVZ-SYNC START -->
  <script src="pvz-ui.js" defer></script>
  <script src="sync/firebase-config.js"></script>
  <script type="module" src="sync/cloud-sync.js"></script>
  <!-- PVZ-SYNC END -->
</body>

</html>
