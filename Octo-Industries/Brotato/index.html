<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <title>Brotato | Octo Industries</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; color: #fff; font: 700 1rem/1.5 system-ui, sans-serif; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; inset: 0; display: grid; place-content: center; gap: .75rem; text-align: center; pointer-events: none; }
    #progress { width: min(24rem, 75vw); }
  </style>
  <script src="coi-serviceworker.min.js"></script>

    <link rel="stylesheet" href="../branding/game-branding.css">
    <script defer src="../branding/game-branding.js"></script>
  </head>
<body>
  <canvas id="canvas" aria-label="Brotato game"></canvas>
  <div id="status" role="status" aria-live="polite">
    <span id="status-message">Loading Brotato locally…</span>
    <progress id="progress" max="163" value="0"></progress>
  </div>
  <script>
    (() => {
      const base = new URL("payload/", document.baseURI);
      const status = document.getElementById("status");
      const message = document.getElementById("status-message");
      const progress = document.getElementById("progress");
      const nativeFetch = window.fetch.bind(window);
      const merged = new Map();
      const waiting = new Map();
      let loadedBytes = 0;
      const sizes = { "index.pck": 144746880, "index.wasm": 26156492 };
      const partCounts = { "index.pck": 8, "index.wasm": 2 };

      function showError(error) {
        message.textContent = `Unable to load Brotato: ${error.message}`;
        progress.hidden = true;
        console.error(error);
      }

      function updateProgress() {
        progress.value = loadedBytes / 1048576;
        message.textContent = `Loading Brotato locally… ${(loadedBytes / 1048576).toFixed(1)} / 163.0 MB`;
      }

      window.fetch = function (input, ...options) {
        const requestUrl = input instanceof Request ? input.url : input;
        const name = new URL(requestUrl, window.location.href).pathname.split("/").pop();
        if (!Object.hasOwn(sizes, name)) return nativeFetch(input, ...options);
        if (merged.has(name)) return Promise.resolve(merged.get(name).clone());
        return new Promise((resolve) => {
          const callbacks = waiting.get(name) || [];
          callbacks.push(resolve);
          waiting.set(name, callbacks);
        });
      };

      async function assemble(name) {
        const parts = [];
        for (let part = 1; part <= partCounts[name]; part += 1) {
          const response = await nativeFetch(new URL(`${name}.part${part}`, base));
          if (!response.ok) throw new Error(`Missing local game data: ${name}.part${part} (${response.status})`);
          const data = await response.arrayBuffer();
          parts.push(data);
          loadedBytes += data.byteLength;
          updateProgress();
        }

        const type = name.endsWith(".wasm") ? "application/wasm" : "application/octet-stream";
        const response = new Response(new Blob(parts, { type }), {
          headers: { "Content-Type": type },
        });
        merged.set(name, response);
        for (const resolve of waiting.get(name) || []) resolve(response.clone());
        waiting.delete(name);
      }

      function startEngine() {
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.async = false;
        script.src = new URL("index.js", base).href;
        script.onerror = () => showError(new Error("The local game engine could not be loaded. Check payload/index.js and the browser console."));
        script.onload = () => {
          try {
            const EngineConstructor = window.Engine || globalThis.Engine;
            if (typeof EngineConstructor !== "function") {
              throw new Error("The local engine loaded without exporting Engine. payload/index.js may be blocked or outdated.");
            }
            const engine = new EngineConstructor({
              args: [],
              canvasResizePolicy: 2,
              executable: "index",
              fileSizes: sizes,
              focusCanvas: true,
            });
            engine.startGame().then(() => {
              status.hidden = true;
              window.dispatchEvent(new Event("resize"));
            }).catch(showError);
          } catch (error) {
            showError(error);
          }
        };
        document.head.appendChild(script);
      }

      Promise.all(Object.keys(sizes).map(assemble)).then(startEngine).catch(showError);
    })();
  </script>
</body>
</html>
