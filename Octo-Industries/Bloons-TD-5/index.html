<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101722">
  <title>Bloons Tower Defense 5</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="../branding/game-loader.css">
  <script src="../branding/game-loader.js"></script>
  <style>
    :root {
      color-scheme: dark;
      background: #101722;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #101722;
    }

    body {
      display: grid;
      min-height: 100svh;
      place-items: center;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .game {
      display: block;
      width: min(100vw, calc(100svh * 800 / 620));
      height: min(100svh, calc(100vw * 620 / 800));
      max-width: 100vw;
      max-height: 100svh;
    }
  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="game" aria-label="Bloons Tower Defense 5 game"></div>
  <script>
    window.addEventListener("load", function () {
      OctoLoader.loadRuffle({
        url: "games/bloons-td-5.swf",
        config: {
          contextMenu: "off",
          frameRate: 60,
          letterbox: "on",
          quality: "low",
          scale: "showAll"
        },
        replace: document.getElementById("game"),
        className: "game"
      });
    });
  </script>
</body>
</html>
