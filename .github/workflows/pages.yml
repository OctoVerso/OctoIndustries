name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out PvZ iPad game source
        uses: actions/checkout@v4
        with:
          repository: fakedummyfortestingthings-web/pvz-ipad
          ref: main
          path: pvz-ipad
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PvZ Pages build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg unzip
          bash pvz-ipad/scripts/install-linux-codecs.sh "$RUNNER_TEMP/pvz-codecs"
          echo "$RUNNER_TEMP/pvz-codecs" >> "$GITHUB_PATH"
      - name: Build static site
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables).
          SUPABASE_FUNCTIONS_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}
        run: npm run pages:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
