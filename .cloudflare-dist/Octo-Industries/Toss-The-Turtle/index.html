<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Toss The Turtle</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="../branding/game-loader.css">
  <script src="../branding/game-loader.js"></script>
  <style>
    :root {
      color-scheme: dark;
      background: #111;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #111;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: auto;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .game {
      display: block;
      width: min(950px, 100vw);
      height: min(680px, calc(100svh - 48px));
      aspect-ratio: 950 / 680;
      max-width: 100vw;
      max-height: calc(100svh - 48px);
    }

  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="game" aria-label="Toss The Turtle game"></div>
  <script>
    window.addEventListener("load", function () {
      OctoLoader.loadRuffle({
        url: "games/toss-the-turtle.swf",
        config: { contextMenu: "off" },
        replace: document.getElementById("game"),
        className: "game"
      });
    });
  </script>
</body>
</html>
